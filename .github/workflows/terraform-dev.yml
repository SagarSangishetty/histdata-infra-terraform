name: Terraform Dev

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/terraform-dev.yml"
      - "environments/dev/**"
      - "modules/**"

  workflow_dispatch:
    inputs:
      operation:
        description: "Choose whether to plan or apply Dev infrastructure"
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply

concurrency:
  group: terraform-dev
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TERRAFORM_VERSION: "1.16.2"
  TF_WORKING_DIR: "environments/dev"
  AWS_REGION: "us-east-1"

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize without remote backend
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate Terraform
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate -no-color

  plan-or-apply:
    name: ${{ inputs.operation == 'apply' && 'Apply' || 'Plan' }} Dev
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_cluster_public_access_cidrs: '["${{ vars.ADMIN_CIDR }}"]'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Verify required repository variable
        env:
          ADMIN_CIDR: ${{ vars.ADMIN_CIDR }}
        run: |
          if [ -z "$ADMIN_CIDR" ]; then
            echo "Repository variable ADMIN_CIDR is not configured."
            exit 1
          fi

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          role-to-assume: arn:aws:iam::935776475838:role/histdata-github-terraform-role
          role-session-name: github-terraform-dev-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: "935776475838"

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Initialize remote backend
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false -lockfile=readonly

      - name: Create Dev plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -input=false -lock-timeout=5m -var-file=dev.tfvars -out=dev.tfplan

      - name: Apply reviewed Dev plan
        if: inputs.operation == 'apply'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -input=false -lock-timeout=5m dev.tfplan
